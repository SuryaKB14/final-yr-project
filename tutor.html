<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Tutor | EZStudy</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #1e1e2f;
    color: white;
}

.container {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* Header */
.header {
    background: #2c2c3c;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}

/* Chat Area */
.chat-box {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

/* Messages */
.message {
    margin: 10px 0;
    padding: 12px;
    border-radius: 10px;
    max-width: 70%;
}

.user {
    background: #6c63ff;
    align-self: flex-end;
}

.bot {
    background: #2c2c3c;
    align-self: flex-start;
}

/* Input Area */
.input-area {
    display: flex;
    padding: 10px;
    background: #2c2c3c;
}

input, select {
    margin: 5px;
    padding: 10px;
    border-radius: 8px;
    border: none;
}

#question {
    flex: 1;
}

button {
    background: #6c63ff;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
🤖 AI Tutor
</div>

<div class="chat-box" id="chatBox"></div>

<div class="input-area">

<select id="subject">
    <option value="math">Math</option>
    <option value="english">English</option>
    <option value="science">Science</option>
    <option value="general">General</option>
</select>



<input type="text" id="question" placeholder="Ask your doubt...">

<button onclick="askTutor()">Send</button>

</div>

</div>

<script>

function addMessage(text, className) {
    const chatBox = document.getElementById("chatBox");

    const msg = document.createElement("div");
    msg.classList.add("message", className);
    msg.innerText = text;

    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
}

async function askTutor() {

    const questionInput = document.getElementById("question");
    const question = questionInput.value;

    const subject = document.getElementById("subject").value;
  

    if (!question.trim()) return;

    addMessage(question, "user");
    questionInput.value = "";

    addMessage("Thinking...", "bot");

    const res = await fetch("http://127.0.0.1:5000/ai-tutor", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            question,
            subject
        })
    });

    const data = await res.json();

    // Remove "Thinking..."
    const chatBox = document.getElementById("chatBox");
    chatBox.removeChild(chatBox.lastChild);

    addMessage(data.answer || "Error occurred", "bot");
}

</script>

</body>
</html>

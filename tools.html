    <script>
        function logout() {
            if(confirm("Are you sure you want to logout?")) {
                window.location.href = "index.html";
            }
        }

        function openTool(toolName) {
            // Hide all tool interfaces
            document.getElementById('summarizer-tool').style.display = 'none';
            document.getElementById('notes-tool').style.display = 'none';
            document.getElementById('flashcards-tool').style.display = 'none';
            
            // Show the selected tool
            document.getElementById(toolName + '-tool').style.display = 'block';
            
            // Scroll to the tool
            document.getElementById(toolName + '-tool').scrollIntoView({behavior: 'smooth'});
        }

        function closeTool(toolName) {
            // Hide the tool
            document.getElementById(toolName + '-tool').style.display = 'none';
            
            // Scroll back to top
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
